<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CC-XFusion Clinical Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f6f9;--c:#fff;--ink:#14263d;--mut:#64748b;--nv:#0b2a4a;--br:#0b2a4a;--tl:#0e9f9a;--soft:#e6f5f4;--ln:#e1e7ee;--ok:#15803d;--wr:#c2410c;--wb:#fff1e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1424;--c:#12233a;--ink:#e6eef8;--mut:#9fb0c6;--nv:#8cc8ff;--br:#1d4e89;--soft:#0f3a40;--ln:#243752;--ok:#4ade80;--wr:#fb923c;--wb:#3a2414}}
:root[data-theme=dark]{--bg:#0a1424;--c:#12233a;--ink:#e6eef8;--mut:#9fb0c6;--nv:#8cc8ff;--br:#1d4e89;--soft:#0f3a40;--ln:#243752;--ok:#4ade80;--wr:#fb923c;--wb:#3a2414}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'IBM Plex Sans',system-ui,sans-serif}
header{background:var(--c);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:28px;padding:12px 32px;position:sticky;top:0;z-index:5}
.logo{font-weight:700;color:var(--nv);font-size:18px;display:flex;gap:8px;align-items:center}.logo i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--br),var(--tl));display:inline-block}
nav{display:flex;gap:4px;flex:1;overflow-x:auto}nav a{padding:7px 12px;border-radius:8px;color:var(--mut);cursor:pointer;white-space:nowrap}nav a.on{background:var(--soft);color:var(--tl);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:28px 32px 90px}h1{font-size:26px;color:var(--nv);margin:0 0 4px}h2{font-size:16px;color:var(--nv);margin:0 0 12px}.sub{color:var(--mut);margin:0 0 22px}
.card{background:var(--c);border:1px solid var(--ln);border-radius:16px;padding:20px}.g2,.g3,.g4{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.btn{background:var(--br);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:600 14px inherit;font-family:inherit;cursor:pointer}.btn.t{background:var(--tl)}.btn.o{background:none;color:var(--nv);border:1px solid var(--ln)}.btn:disabled{opacity:.4;cursor:not-allowed}
.big{font-size:30px;font-weight:700;color:var(--nv)}.mut{color:var(--mut)}.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--tl)}.pill.w{background:var(--wb);color:var(--wr)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--ln);font-size:13px}th{color:var(--mut);font-weight:500}tr.r{cursor:pointer}tr.r:hover{background:var(--soft)}
input,select{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--c);color:var(--ink);font:inherit}label{font-size:12px;color:var(--mut);display:block;margin:0 0 4px}
.bar{height:10px;border-radius:9px;background:var(--ln);overflow:hidden;margin:4px 0 12px}.bar b{display:block;height:100%;background:var(--tl);border-radius:9px}.bar.n b{background:var(--br)}
.up{border:2px dashed var(--ln);border-radius:14px;padding:22px;text-align:center;margin-bottom:12px}.up.ok{border-color:var(--tl);background:var(--soft)}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.node{padding:10px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--c);font-weight:500;transition:.4s}.node.on{border-color:var(--tl);background:var(--soft);color:var(--tl)}.node.hot{background:var(--br);color:#fff;border-color:var(--br)}.ar{color:var(--mut)}
.foot{position:fixed;bottom:0;left:0;right:0;padding:10px 32px calc(10px + env(safe-area-inset-bottom,0px));background:var(--c);border-top:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:5}
.disc{font-size:12px;color:var(--mut);margin-top:16px}.seg{display:inline-flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden;margin-bottom:12px}.seg button{border:0;background:var(--c);color:var(--mut);padding:8px 14px;cursor:pointer;font:inherit}.seg button.on{background:var(--br);color:#fff}
.hub{width:210px;height:210px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:8px solid var(--tl);background:var(--c);margin:auto;box-shadow:0 0 0 10px var(--soft)}.hub.w{border-color:var(--wr);box-shadow:0 0 0 10px var(--wb)}
.cn{display:grid;grid-template-columns:1fr 230px 1fr;gap:12px;align-items:center}.lnk{height:4px;background:var(--tl);border-radius:4px}.lnk.w{background:repeating-linear-gradient(90deg,var(--wr) 0 8px,transparent 8px 14px)}
.chain{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:18px}.chain .node{width:300px;text-align:center}
.login{max-width:400px;margin:9vh auto}.rep h3{margin:16px 0 4px;color:var(--nv);font-size:14px;border-bottom:1px solid var(--ln);padding-bottom:4px}
.toast{position:fixed;top:70px;right:24px;background:var(--br);color:#fff;padding:10px 16px;border-radius:10px;z-index:9}
@media print{header,.foot,.noprint{display:none!important}}
@media(max-width:820px){.g2,.g3,.g4,.cn{grid-template-columns:1fr}main{padding:20px 16px 90px}header{padding:10px 16px;gap:12px;flex-wrap:wrap}}
</style></head><body><div id="app"></div><input type="file" id="fh" accept="image/*" hidden><input type="file" id="fg" accept=".csv,.tsv,.txt" hidden>
<script>
const $=s=>document.querySelector(s);
const S={s:'login',h:0,g:0,warn:0,mode:'ov',p:0,hImg:'',gName:'',gN:0};
const NAV=[['Dashboard','dash'],['New Analysis','new'],['Patients','dash'],['Analysis History','dash'],['Model Insights','ins'],['Reports','rep']];
const FLOW=['new','proc','res','his','gene','con','unc','sum','rep'];
const LBL={new:'Upload',proc:'Processing',res:'Result',his:'Tissue',gene:'Genes',con:'Consistency',unc:'Uncertainty',sum:'Summary',rep:'Report'};
const D='Demonstration data. Not live clinical output.';
const DIS='AI-generated result is intended for clinical decision support and does not replace professional diagnosis.';
const ROWS=[['P-10482','10 Oct 2026','Complete','Complete',91,'CRC high probability',92,'Pending'],['P-10477','09 Oct 2026','Complete','Complete',88,'CRC high probability',89,'Reviewed'],['P-10469','08 Oct 2026','Complete','Complete',38,'Indeterminate',61,'Requires review'],['P-10455','06 Oct 2026','Complete','Complete',94,'Low probability',95,'Reviewed'],['P-10431','04 Oct 2026','Low quality','Complete',52,'CRC probable',70,'Requires review']];
const bar=(l,v,c='')=>`<div style="display:flex;justify-content:space-between"><span>${l}</span><b>${v}%</b></div><div class="bar ${c}"><b style="width:${v}%"></b></div>`;
const gauge=(p,t,col='var(--tl)')=>`<svg viewBox="0 0 180 110" width="100%" style="max-width:260px"><path d="M10 95A80 80 0 0 1 170 95" fill="none" stroke="var(--ln)" stroke-width="16" stroke-linecap="round"/><path d="M10 95A80 80 0 0 1 170 95" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${p*2.513} 252"/><text x="90" y="82" text-anchor="middle" font-size="26" font-weight="700" fill="var(--nv)">${p}%</text><text x="90" y="102" text-anchor="middle" font-size="10" fill="var(--mut)">${t}</text></svg>`;
function tis(m){let r=3,R=()=>(r=(r*9301+49297)%233280)/233280,g='',d='';
for(let i=0;i<24;i++){let x=25+R()*350,y=25+R()*230,rx=13+R()*14,ry=9+R()*9,a=R()*180;g+=`<g transform="rotate(${a} ${x} ${y})"><ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#fbeef5" stroke="#8b3f86" stroke-width="3"/><ellipse cx="${x}" cy="${y}" rx="${rx*.45}" ry="${ry*.4}" fill="#e9c3dc"/></g>`}
for(let i=0;i<160;i++)d+=`<circle cx="${R()*400}" cy="${R()*280}" r="1.6" fill="#5b2a86" opacity=".5"/>`;
const B=[[110,90,62],[285,150,56],[200,225,42]],bl=B.map(b=>`<circle cx="${b[0]}" cy="${b[1]}" r="${b[2]}" fill="url(#h)"/>`).join(''),lb=B.map((b,i)=>`<g><circle cx="${b[0]}" cy="${b[1]}" r="11" fill="#0b2a4a"/><text x="${b[0]}" y="${b[1]+4}" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">${i+1}</text></g>`).join('');
return `<svg viewBox="0 0 400 280" width="100%" style="border-radius:12px;display:block"><defs><radialGradient id="h"><stop offset="0" stop-color="#ef4444" stop-opacity=".85"/><stop offset=".5" stop-color="#f59e0b" stop-opacity=".5"/><stop offset="1" stop-color="#facc15" stop-opacity="0"/></radialGradient></defs><rect width="400" height="280" fill="${m=='at'?'#0b2a4a':'#f0cfe0'}"/>${m=='at'?'':(S.hImg?`<image href="${S.hImg}" width="400" height="280" preserveAspectRatio="xMidYMid slice"/>`:g+d)}${m=='or'?'':bl}${m=='or'?'':lb}</svg>`}
function head(t,s){return `<h1>${t}</h1><p class="sub">${s||''}</p>`}
function hdr(){return `<header><div class="logo"><i></i>CC-XFusion</div><nav>${NAV.map(n=>`<a data-go="${n[1]}" class="${S.s==n[1]&&(n[0]=='Dashboard'||n[1]!='dash')?'on':''}">${n[0]}</a>`).join('')}</nav><span class="mut">Dr. A. Rao · Pathology</span></header>`}
function foot(){const i=FLOW.indexOf(S.s);if(i<0||S.s=='proc')return'';const nx=FLOW[i+1];return `<div class="foot"><button class="btn o" data-go="${i?FLOW[i-1]:'dash'}">Back</button><span class="mut">${FLOW.map((f,j)=>`<a data-go="${f}" style="cursor:pointer;margin:0 5px;${j==i?'color:var(--tl);font-weight:700':''}">${LBL[f]}</a>`).join('')}</span>${nx?`<button class="btn t" data-go="${nx}">Next: ${LBL[nx]}</button>`:`<button class="btn t" data-go="dash">Finish</button>`}</div>`}
const V={
login:()=>`<div class="login card" style="padding:32px"><div class="logo" style="font-size:24px"><i></i>CC-XFusion</div><p class="mut">Clinically Explainable Multimodal AI</p><label>Clinical ID or email</label><input value="dr.rao@hospital.org"><br><br><label>Password</label><input type="password" value="password"><br><br><button class="btn" style="width:100%" data-go="dash">Sign in</button><p class="disc">Research prototype for academic demonstration.</p></div>`,
dash:()=>`<div style="display:flex;justify-content:space-between;align-items:center">${head('CC-XFusion Clinical Dashboard','Clinician decision-support overview (demonstration data)')}<button class="btn t" data-go="new">+ Start New Analysis</button></div><div class="g4" style="margin-bottom:16px">${[['Total Analyses','248'],['High Confidence','196'],['Requires Review','37'],['Consistency Alerts','15']].map(c=>`<div class="card"><div class="mut">${c[0]}</div><div class="big">${c[1]}</div></div>`).join('')}</div><div class="card"><h2>Recent Analyses</h2><table><tr><th>Patient ID</th><th>Date</th><th>Image</th><th>Gene</th><th>Consistency</th><th>AI Result</th><th>Confidence</th><th>Review</th></tr>${ROWS.map(r=>`<tr class="r" data-go="res"><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td><span class="pill ${r[4]<60?'w':''}">${r[4]}%</span></td><td>${r[5]}</td><td>${r[6]}%</td><td>${r[7]}</td></tr>`).join('')}</table></div>`,
new:()=>`${head('New CRC Analysis','Enter patient details and add both data types')}<div class="card" style="margin-bottom:16px"><h2>Patient information</h2><div class="g4" style="grid-template-columns:repeat(5,1fr)">${[['Patient ID','P-10482'],['Age','64'],['Sex','Male'],['Sample ID','S-77-0193'],['Collection date','2026-10-09']].map(f=>`<div><label>${f[0]}</label><input value="${f[1]}"></div>`).join('')}</div></div><div class="g2"><div class="card"><h2>Histopathology Image</h2><div class="up ${S.h?'ok':''}">${S.h?(S.hImg?'<img src="'+S.hImg+'" style="width:100%;max-height:220px;object-fit:cover;border-radius:12px">':tis('or')):'Upload whole-slide or tissue image'}<br><br><button class="btn" data-act="uh">${S.h?'Replace image':'Upload image'}</button> <button class="btn o" data-act="h">Use demo slide</button></div>${S.h?`<table><tr><td>Tissue detected</td><td><b>Yes (Otsu threshold)</b></td></tr><tr><td>Image quality</td><td><b>Good</b></td></tr><tr><td>Magnification</td><td><b>20×</b></td></tr><tr><td>Patch extraction</td><td><b>1,284 patches (256×256)</b></td></tr></table>`:''}</div><div class="card"><h2>Gene Expression</h2><div class="up ${S.g?'ok':''}">${S.g?(S.gName||'rnaseq_P-10482.csv'):'Upload RNA-seq or gene-expression data'}<br><br><button class="btn" data-act="ug">${S.g?'Replace file':'Upload file'}</button> <button class="btn o" data-act="g">Use demo file</button></div>${S.g?`<table><tr><td>Genes detected</td><td><b>${S.gN?S.gN.toLocaleString():'20,531'}</b></td></tr><tr><td>Informative genes selected</td><td><b>${S.gN?Math.min(500,S.gN):500}</b></td></tr><tr><td>Normalization</td><td><b>log-transform + z-score done</b></td></tr><tr><td>Data quality</td><td><b>Good</b></td></tr></table>`:''}</div></div><p style="text-align:right"><button class="btn t" data-go="proc" ${S.h&&S.g?'':'disabled'}>Run CC-XFusion Analysis</button></p>`,
proc:()=>{const p=S.p;return `${head('CC-XFusion Analysis','Dual-stream encoders, consistency check, then gated fusion')}<div class="card" style="margin-bottom:16px"><div class="flow" style="margin-bottom:14px"><div class="node ${p>0?'on':''}">Histopathology Image</div><span class="ar">→</span><div class="node ${p>1?'on':''}">ResNet-50 + Attention</div><span class="ar">→</span><div class="node ${p>2?'on':''}">Morphological Features</div></div><div class="flow" style="margin-bottom:14px"><div class="node ${p>0?'on':''}">Gene Expression</div><span class="ar">→</span><div class="node ${p>1?'on':''}">Gene Selection + MLP</div><span class="ar">→</span><div class="node ${p>2?'on':''}">Molecular Features</div></div><div class="flow"><div class="node ${p>3?'hot':''}">Cross-Modal Consistency</div><span class="ar">→</span><div class="node ${p>4?'hot':''}">Gated Attention Fusion</div><span class="ar">→</span><div class="node ${p>5?'on':''}">Classification</div><span class="ar">→</span><div class="node ${p>5?'on':''}">Explainable Prediction</div></div></div><div class="g3"><div class="card"><h2>Image contribution</h2><div class="big">${p>4?56:'…'}${p>4?'%':''}</div></div><div class="card"><h2>Gene contribution</h2><div class="big">${p>4?44:'…'}${p>4?'%':''}</div></div><div class="card"><h2>Consistency score</h2><div class="big">${p>3?91:'…'}${p>3?'%':''}</div></div></div><p>Status: <b>${p>5?'Complete':'Running step '+(p+1)+' of 6'}</b></p><div class="bar"><b style="width:${Math.min(p,6)/6*100}%"></b></div>${p>5?'<button class="btn t" data-go="res">View clinical result</button>':''}`},
res:()=>`${head('AI-Supported Clinical Result','Patient P-10482 · Sample S-77-0193')}<div class="card" style="background:var(--br);color:#fff;margin-bottom:16px"><div style="opacity:.8">AI-supported prediction</div><div style="font-size:34px;font-weight:700">Colorectal Cancer: HIGH PROBABILITY</div><div style="display:flex;gap:40px;margin-top:10px"><div>Confidence<div class="big" style="color:#fff">92%</div></div><div>Cross-Modal Consistency<div class="big" style="color:#fff">91% · Strong Agreement</div></div></div></div><div class="g4">${[['Model confidence','92%'],['Image quality','Good'],['Gene data quality','Good'],['Overall uncertainty','Low']].map(c=>`<div class="card"><div class="mut">${c[0]}</div><div class="big">${c[1]}</div></div>`).join('')}</div><p class="disc">${DIS} This is not a definitive diagnosis.</p>`,
his:()=>`${head('Visual Explanation','Where the image encoder focused')}<div class="g2" style="grid-template-columns:1.5fr 1fr"><div class="card"><div class="seg">${[['or','Original Image'],['at','Attention Map'],['ov','Overlay']].map(m=>`<button data-act="m" data-v="${m[0]}" class="${S.mode==m[0]?'on':''}">${m[1]}</button>`).join('')}</div>${tis(S.mode)}<p class="disc">Highlighted regions represent tissue areas that contributed strongly to the prediction. Heatmap is illustrative; the prototype does not run the model.</p></div><div class="card"><h2>Important Tissue Regions</h2>${[['Region 1','High importance','Abnormal glandular structures',90],['Region 2','High importance','Tumor boundary',84],['Region 3','Moderate importance','Stromal infiltration',61]].map(r=>`<div style="margin-bottom:8px"><b>${r[0]}</b> <span class="pill ${r[3]<70?'w':''}">${r[1]}</span><div class="mut">${r[2]}</div>${bar('Attention',r[3])}</div>`).join('')}</div></div>`,
gene:()=>`${head('Molecular Explanation','Gene-importance scores · '+D)}<div class="g2"><div class="card"><h2>Gene importance</h2>${[['TP53',88],['KRAS',81],['APC',76],['BRAF',54],['MLH1',47]].map(g=>bar(g[0],g[1],'n')).join('')}</div><div class="card"><h2>Expression pattern</h2><table><tr><th>Gene</th><th>z-score</th><th>Pattern</th><th>Contribution</th></tr>${[['TP53','+2.1','Up','High'],['KRAS','+1.8','Up','High'],['APC','−1.6','Down','High'],['BRAF','+0.9','Up','Moderate'],['MLH1','−0.7','Down','Moderate']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table><p>Selected informative genes: <b>500</b> of 20,531.</p></div></div><p class="disc">Selected gene-expression patterns contributed to the molecular representation used by the model.</p>`,
con:()=>{const w=S.warn,a=w?88:90,b=w?31:94,c=w?38:91;return `<div style="display:flex;justify-content:space-between;align-items:center">${head('Cross-Modal Consistency Analysis','Does tissue evidence agree with molecular evidence?')}<div class="seg"><button data-act="w0" class="${w?'':'on'}">Strong agreement</button><button data-act="w1" class="${w?'on':''}">Conflict state</button></div></div><div class="cn"><div class="card"><h2>Histopathology Evidence</h2><div class="mut">CRC likelihood</div><div class="big">${a}%</div>${bar('',a,'n')}</div><div><div class="lnk ${w?'w':''}" style="margin-bottom:10px"></div><div class="hub ${w?'w':''}"><div class="mut" style="font-weight:600">CONSISTENCY CHECK</div><div style="font-size:38px;font-weight:700;color:${w?'var(--wr)':'var(--tl)'}">${c}%</div><b>${w?'LOW CONSISTENCY':'STRONG AGREEMENT'}</b></div><div class="lnk ${w?'w':''}" style="margin-top:10px"></div></div><div class="card"><h2>Gene Expression Evidence</h2><div class="mut">CRC likelihood</div><div class="big">${b}%</div>${bar('',b)}</div></div><div class="g2" style="margin-top:16px"><div class="card">${w?`<span class="pill w">Low Consistency / Modality Conflict</span><p>✗ Tissue and molecular evidence disagree</p><p>✗ Modality conflict detected</p><p><b style="color:var(--wr)">Manual Clinical Review Required</b></p>`:`<p>✓ Morphological evidence supports molecular evidence</p><p>✓ No major modality conflict detected</p><p>✓ Both modalities contribute to the final prediction</p>`}</div><div class="card"><h2>Modality contribution</h2>${bar('Histopathology',56,'n')}${bar('Gene Expression',44)}</div></div><p class="disc">The consistency constraint helps reduce excessive dependence on a single modality and identifies conflicting evidence. ${D}</p>`},
unc:()=>`${head('Confidence & Uncertainty','Calibrated uncertainty from the model')}<div class="g2"><div class="card" style="text-align:center">${gauge(92,'Prediction confidence')}<h2>Overall uncertainty: Low</h2></div><div class="card"><table>${[['Prediction confidence','92%'],['Cross-modal agreement','High'],['Image quality','Good'],['Gene data quality','Good'],['Overall uncertainty','Low']].map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td></tr>`).join('')}</table></div></div><div class="card" style="margin-top:16px;border-color:var(--tl)"><h2>Clinical Review Recommendation</h2>Expert review recommended before final clinical decision.</div>`,
sum:()=>`${head('Why did the AI make this prediction?','The model checks agreement between modalities before it fuses them')}<div class="chain">${['Tissue Evidence','Molecular Evidence','Cross-Modal Consistency','Adaptive / Gated Fusion','AI-Supported Prediction'].map((t,i)=>`${i?'<span class="ar">↓</span>':''}<div class="node ${i==2||i==3?'hot':''}">${t}</div>`).join('')}</div><div class="g4">${[['Histopathology Evidence','Abnormal glands and tumor boundary drew high attention. Likelihood 90%.'],['Molecular Evidence','TP53, KRAS and APC patterns led the gene score. Likelihood 94%.'],['Cross-Modal Consistency','Both modalities agree (91%). A conflict would trigger manual review.'],['Confidence & Uncertainty','Confidence 92%, uncertainty low. Expert review still advised.']].map(c=>`<div class="card"><h2>${c[0]}</h2>${c[1]}</div>`).join('')}</div><p class="disc">Unlike simple concatenation, CC-XFusion evaluates agreement first, then weights each modality with learned gates.</p>`,
rep:()=>`<div class="noprint" style="display:flex;justify-content:space-between;align-items:center">${head('Clinical Report','P-10482')}<div><button class="btn o" data-act="dl">Download Report</button> <button class="btn" data-act="pr">Print Report</button></div></div><div class="card rep"><h3 style="margin-top:0">Patient information</h3>P-10482 · 64 · Male · Sample S-77-0193 · Collected 09 Oct 2026<h3>AI-supported prediction</h3><b>Colorectal cancer: high probability</b> · Confidence 92%<h3>Cross-modal consistency</h3>91%, strong agreement (histopathology 90%, gene 94%). Contribution 56% / 44%.<h3>Histopathology explanation</h3>Attention concentrated on abnormal glandular structures and tumor boundaries.<h3>Important tissue regions</h3>Region 1 and 2 high importance; Region 3 moderate.<h3>Gene expression explanation</h3>Demonstration genes: TP53, KRAS, APC, BRAF, MLH1.<h3>Uncertainty</h3>Low. Image and gene data quality good.<h3>Clinical review recommendation</h3>Expert review recommended before final clinical decision.<p class="disc">${DIS}</p></div>`,
ins:()=>`${head('CC-XFusion Model Performance','Research / prototype results on TCGA-COAD, not live clinical performance')}<div class="g3" style="margin-bottom:16px">${[['AUC','0.962'],['Accuracy','0.92'],['F1 Score','0.93']].map(c=>`<div class="card"><div class="mut">${c[0]}</div><div class="big">${c[1]}</div></div>`).join('')}</div><div class="card" style="margin-bottom:16px"><h2>AUC comparison</h2>${[['CNN-MIL',.842],['Gene MLP',.885],['Concatenation Fusion',.91],['MCAT',.935],['CC-XFusion (proposed)',.962]].map((m,i)=>`<div style="display:flex;justify-content:space-between"><span ${i==4?'style="font-weight:700;color:var(--tl)"':''}>${m[0]}</span><b>${m[1]}</b></div><div class="bar ${i<4?'n':''}"><b style="width:${(m[1]-.7)/.3*100}%"></b></div>`).join('')}<div class="mut">Axis starts at 0.70.</div></div><div class="g3">${[['Cross-modal consistency','Penalizes disagreement between image and gene predictions.'],['Reduced modality dominance','Gates keep one modality from taking over.'],['Explainable tissue attention','Highlights glands and tumor boundaries.'],['Gene importance','Ranks molecular drivers of the prediction.'],['Uncertainty estimation','Flags ambiguous cases for review.'],['Robust multimodal representation','Shared latent space tolerates a noisy modality.']].map(c=>`<div class="card"><h2>${c[0]}</h2>${c[1]}</div>`).join('')}</div>`
};
document.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();if(e.target.id=='fh'){r.onload=()=>{S.h=1;S.hImg=r.result;draw()};r.readAsDataURL(f)}else if(e.target.id=='fg'){r.onload=()=>{S.g=1;S.gName=f.name;S.gN=Math.max(0,r.result.split('\n').filter(x=>x.trim()).length-1);draw()};r.readAsText(f)}e.target.value=''});
let tm;
function go(s){clearInterval(tm);S.s=s;if(s=='proc'){S.p=0;tm=setInterval(()=>{if(S.p<6){S.p++;draw()}else clearInterval(tm)},900)}draw();scrollTo(0,0)}
function draw(){$('#app').innerHTML=(S.s=='login'?'':hdr())+(S.s=='login'?V.login():`<main>${V[S.s]()}</main>`)+foot()}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-act]');if(!t)return;if(t.dataset.go)return go(t.dataset.go);const a=t.dataset.act;
if(a=='uh')return $('#fh').click();if(a=='ug')return $('#fg').click();if(a=='h'){S.h=1;S.hImg=''}if(a=='g'){S.g=1;S.gName='';S.gN=0}if(a=='m')S.mode=t.dataset.v;if(a=='w0')S.warn=0;if(a=='w1')S.warn=1;
if(a=='dl')return toast('Demo: report export is simulated');if(a=='pr'){try{print()}catch(x){toast('Print is unavailable here')}return}draw()});
draw();
</script></body></html>
